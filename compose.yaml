services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Containerfile
    command: ["/app/migrate"]
    entrypoint: []
    environment:
      DATABASE_URL: postgres://tasks:tasks@db:5432/tasks?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://tasks:tasks@db:5432/tasks?sslmode=disable
      SHUTDOWN_TIMEOUT: 10s
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:

